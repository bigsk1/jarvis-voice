<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Jarvis Canvas{% endblock %}</title>
    <link rel="icon" type="image/png" sizes="256x256" href="/static/assets/jarvis-voice.png">
    <link rel="apple-touch-icon" href="/static/assets/jarvis-voice.png">
    
    <!-- Self-hosted fonts (symlink static/fonts → jarvis-web/client/fonts) -->
    <link rel="stylesheet" href="/static/css/fonts.css">
    <!-- Base styles -->
    <link rel="stylesheet" href="/static/css/base.css">
    
    {% block head %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
    <script src="/static/js/jarvis-hud-logo.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>

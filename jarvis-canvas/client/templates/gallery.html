{% extends "base.html" %}

{% block title %}Images Gallery - Generated Images{% endblock %}

{% block head %}
    <!-- Gallery styles -->
    <link rel="stylesheet" href="/static/css/gallery.css">
{% endblock %}

{% block body %}
    <header class="header media-gallery-header image-gallery-header">
        <div class="logo">
            <div class="logo-icon jarvis-hud-logo online" aria-hidden="true"></div>
            <span>Gallery</span>
        </div>
        <div class="header-stats">
            <span id="imageCount">0 images</span>
            <span id="totalSize">0 MB</span>
        </div>
        <div class="header-links">
            <a href="/" class="header-link" title="Back to Canvas">📝 <span>Canvas</span></a>
            <a href="/video-gallery" class="header-link" title="Video Gallery">🎬 <span>Videos</span></a>
            <a href="/audio-gallery" class="header-link audio-nav-link" title="Audio Gallery">🎵 <span class="audio-mobile-label">Audio</span></a>
            <a href="#" class="header-link" onclick="window.open('http://' + window.location.hostname + ':5001', '_blank'); return false;"><img src="/static/assets/jarvis-voice.png" alt="" class="jarvis-mark" aria-hidden="true"> <span>Jarvis</span></a>
        </div>
    </header>

    <main class="main">
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search images..." oninput="filterImages()">
            </div>
            <select class="filter-select" id="providerFilter" onchange="filterImages()">
                <option value="all">All Providers</option>
                <option value="xai">xAI</option>
                <option value="openai">OpenAI</option>
                <option value="gemini">Gemini</option>
            </select>
            <select class="filter-select" id="favoriteFilter" onchange="filterImages()">
                <option value="all">All Images</option>
                <option value="favorites">Favorites</option>
            </select>
            <select class="sort-select" id="sortSelect" onchange="sortImages()">
                <option value="date-desc">Newest First</option>
                <option value="date-asc">Oldest First</option>
                <option value="name-asc">Name A-Z</option>
                <option value="name-desc">Name Z-A</option>
                <option value="size-desc">Largest First</option>
                <option value="size-asc">Smallest First</option>
                <option value="cdn-desc">CDN Uploaded First</option>
                <option value="cdn-asc">Not Uploaded First</option>
            </select>
            <button type="button" class="btn btn-secondary refresh-btn" id="refreshBtn" onclick="refreshGallery()">
                <span class="refresh-btn-icon" aria-hidden="true">↻</span>
                <span class="refresh-btn-label">Refresh</span>
            </button>
            <a class="btn btn-secondary cdn-export-btn" id="exportCdnCatalogBtn" href="/api/gallery/cdn-catalog/export" target="_blank" rel="noopener" title="Open current Cloudflare CDN catalog as HTML">
                <span aria-hidden="true">☁</span>
                <span>CDN HTML</span>
            </a>
        </div>

        <div class="gallery" id="gallery"></div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-state-icon">🖼️</div>
            <h3>No images found</h3>
            <p>Generated images will appear here</p>
        </div>
    </main>

    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <img id="lightboxImage" src="" alt="">
            <div class="lightbox-info">
                <span class="lightbox-filename" id="lightboxFilename"></span>
                <div class="lightbox-actions">
                    <button class="btn btn-favorite" onclick="toggleFavoriteCurrent()" id="lightboxFavoriteBtn" aria-pressed="false">♡ Favorite</button>
                    <button class="btn btn-primary" onclick="downloadImage()">⬇️ Download</button>
                    <button class="btn btn-secondary" onclick="getCdnUrlFromLightbox()" id="lightboxCdnBtn">🔗 Get URL</button>
                    <button class="btn btn-accent" onclick="sendCurrentImageToJarvisWeb()" id="lightboxVideoBtn">🎬 Send to Jarvis</button>
                    <button class="btn btn-danger" onclick="deleteFromLightbox()">🗑️ Delete</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Gallery JavaScript -->
    <script src="/static/js/gallery.js"></script>
{% endblock %}

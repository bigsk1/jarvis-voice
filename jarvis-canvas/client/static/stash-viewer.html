<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stash Viewer - Jarvis Canvas</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/css/fonts.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-primary, #12121a);
      color: var(--text-primary, #e8e8ef);
      font-family: var(--font-sans, system-ui, sans-serif);
    }
    .stash-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .stash-header {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: 1rem 1.25rem;
      background: rgba(18, 18, 26, 0.94);
      border-bottom: 1px solid var(--border-primary, #2a2a38);
      backdrop-filter: blur(10px);
    }
    .stash-title { min-width: 0; }
    .stash-title h1 {
      margin: 0 0 4px;
      font-size: 1.25rem;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    .stash-ref {
      color: var(--text-tertiary, #888);
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      overflow-wrap: anywhere;
    }
    .stash-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
    .stash-btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 36px; padding: 7px 12px;
      border: 1px solid var(--border-secondary, #3d3d4d);
      border-radius: 8px;
      background: var(--bg-tertiary, #1e1e2a);
      color: var(--text-primary, #e8e8ef);
      text-decoration: none;
      font-size: 0.875rem;
      cursor: pointer;
    }
    .stash-btn:hover { background: var(--bg-hover, #2a2a38); border-color: #6366f1; }
    .stash-main {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 1.25rem 0 3rem;
    }
    .stash-status {
      color: var(--text-secondary, #b8b8c8);
      padding: 1.25rem;
      border: 1px solid var(--border-primary, #2a2a38);
      border-radius: 8px;
      background: var(--bg-card, #1a1a24);
    }
    .markdown-viewer, .text-viewer {
      background: var(--bg-card, #1a1a24);
      border: 1px solid var(--border-primary, #2a2a38);
      border-radius: 8px;
      padding: 1.25rem;
      overflow-x: auto;
      line-height: 1.6;
    }
    .markdown-viewer h1, .markdown-viewer h2, .markdown-viewer h3 {
      margin: 1.2em 0 0.45em;
      line-height: 1.25;
    }
    .markdown-viewer p, .markdown-viewer li { color: var(--text-secondary, #b8b8c8); }
    .markdown-viewer a { color: #818cf8; overflow-wrap: anywhere; }
    .text-viewer { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.875rem; }
    @media (max-width: 720px) {
      .stash-header { flex-direction: column; align-items: flex-start; }
      .stash-actions { width: 100%; }
      .stash-btn { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="stash-shell">
    <header class="stash-header">
      <div class="stash-title">
        <h1 id="stashTitle">Loading stash artifact...</h1>
        <div class="stash-ref" id="stashRef"></div>
      </div>
      <div class="stash-actions">
        <a class="stash-btn" id="rawLink" href="#" target="_blank" rel="noopener noreferrer">Raw</a>
        <a class="stash-btn" id="downloadLink" href="#" download>Download</a>
      </div>
    </header>
    <main class="stash-main">
      <div class="stash-status" id="stashStatus">Loading...</div>
      <article id="stashContent" hidden></article>
    </main>
  </div>
  <script>
    (() => {
      const titleEl = document.getElementById('stashTitle');
      const refEl = document.getElementById('stashRef');
      const statusEl = document.getElementById('stashStatus');
      const contentEl = document.getElementById('stashContent');
      const rawLink = document.getElementById('rawLink');
      const downloadLink = document.getElementById('downloadLink');

      function parsePath() {
        const match = window.location.pathname.match(/^\/stash\/view\/([^/]+)\/([^/]+)$/);
        if (!match) return null;
        return {
          spaceId: decodeURIComponent(match[1]),
          fileId: decodeURIComponent(match[2]),
        };
      }

      function isMarkdown(contentType, filename) {
        return /markdown/i.test(contentType) || /\.md$/i.test(filename || '');
      }

      function isTextLike(contentType, filename) {
        return (
          /^text\//i.test(contentType)
          || /(json|xml|csv|javascript)/i.test(contentType)
          || /\.(txt|md|json|csv|log|srt)$/i.test(filename || '')
        );
      }

      function parseMarkdownSafe(text) {
        if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
          return DOMPurify.sanitize(marked.parse(text, { breaks: true, gfm: true }));
        }
        const esc = document.createElement('div');
        esc.textContent = text;
        return esc.innerHTML;
      }

      async function loadArtifact() {
        const parsed = parsePath();
        if (!parsed) {
          throw new Error('Invalid stash viewer URL.');
        }

        const stashRef = `stash://${parsed.spaceId}/${parsed.fileId}`;
        const rawUrl = `/api/stash/${encodeURIComponent(parsed.spaceId)}/${encodeURIComponent(parsed.fileId)}`;
        rawLink.href = rawUrl;
        downloadLink.href = rawUrl;
        refEl.textContent = stashRef;

        const response = await fetch(rawUrl, { credentials: 'same-origin' });
        if (!response.ok) {
          throw new Error(`Could not load stash artifact (${response.status}).`);
        }

        const contentType = response.headers.get('content-type') || '';
        const filename = response.headers.get('x-stash-filename') || parsed.fileId;
        titleEl.textContent = filename;
        downloadLink.download = filename;
        document.title = `${filename} - Stash Viewer`;

        if (!isTextLike(contentType, filename)) {
          statusEl.hidden = true;
          contentEl.hidden = false;
          contentEl.className = 'stash-status';
          contentEl.innerHTML = `
            <p>This stash artifact is not a text/markdown file.</p>
            <p><a href="${rawUrl}" target="_blank" rel="noopener noreferrer">Open the raw file</a></p>
          `;
          return;
        }

        const text = await response.text();
        statusEl.hidden = true;
        contentEl.hidden = false;

        if (isMarkdown(contentType, filename)) {
          contentEl.className = 'markdown-viewer';
          contentEl.innerHTML = parseMarkdownSafe(text);
        } else {
          contentEl.className = 'text-viewer';
          if (/json/i.test(contentType) || /\.json$/i.test(filename)) {
            try {
              contentEl.textContent = JSON.stringify(JSON.parse(text), null, 2);
            } catch {
              contentEl.textContent = text;
            }
          } else {
            contentEl.textContent = text;
          }
        }
      }

      loadArtifact().catch((error) => {
        titleEl.textContent = 'Could not load stash artifact';
        statusEl.textContent = error.message || 'Unknown stash viewer error.';
      });
    })();
  </script>
</body>
</html>

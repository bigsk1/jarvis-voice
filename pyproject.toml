[project]
name = "jarvis-voice"
version = "2.56.2"
description = "Self-hosted intelligent voice assistant"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.115.0",
    "openai==2.24.0",
    "xai-sdk>=1.17.0",
    "google-genai>=2.10.0",
    # API Server
    "fastapi>=0.137.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    # Web UIs
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "flask-socketio>=5.3.0",
    "python-engineio>=4.13.4",
    "python-socketio>=5.10.0",
    "simple-websocket>=1.0.0",
    # Docker monitoring
    "docker>=7.0.0",
    # Dashboard
    "psutil>=7.0.0",
    "textual>=6.0.0",
    # Core dependencies
    "av==15.1.0",
    "certifi==2026.10.19",
    "cffi==2.0.0",
    "charset-normalizer==3.4.3",
    "coloredlogs==15.0.1",
    "ctranslate2==4.6.0",
    "faster-whisper==1.2.0",
    "fast-flights==3.0.2",
    "filelock==3.20.3",
    "cryptography==50.0.2",
    "flatbuffers==25.2.10",
    "fsspec==2026.6.0",
    "hf-xet==1.1.10",
    "huggingface-hub==0.35.0",
    "humanfriendly==10.0",
    "idna==3.15",
    "joblib==1.5.2",
    "mpmath==1.3.0",
    "numpy==2.3.3",
    "onnxruntime==1.22.1",
    "openwakeword==0.4.0",
    "packaging==25.0",
    "protobuf==6.33.5",
    "pycparser==2.23",
    "PyYAML==6.0.2",
    "requests==2.33.0",
    "scikit-learn==1.7.2",
    "scipy==1.16.2",
    "setuptools==84.1.0",
    "sounddevice==0.5.2",
    "soundfile==0.13.1",
    "speexdsp-ns==0.1.2",
    "sympy==1.14.0",
    "threadpoolctl==3.6.0",
    "tokenizers==0.22.0",
    "tqdm==4.67.1",
    "typing_extensions==4.15.0",
    "urllib3==2.8.0",
    "fpdf2>=2.8.5",
    "Pillow>=13.0.0",
    "brotli>=1.2.1",
    "markdown-it-py[linkify]>=4.0.0",
    "pymupdf>=1.26.0",
    "spotipy>=2.25.0",
    "yt-dlp[default]>=2026.10.26",
    "qrcode==8.2",
    "paramiko>=3.0.0",
    "yfinance>=1.1.0",
    "python-multipart>=0.0.22",
    "jsonschema>=4.23.0",
]

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=9.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.2",
]

[tool.uv]
# Jarvis is an application repository, not an importable Python package.
# Install only its dependencies; do not ask uv/Hatch to build an editable
# `jarvis_voice` package that does not exist.
package = false

# Security floors for transitive dependencies, without adding runtime packages.
constraint-dependencies = [
    "aiohttp>=3.14.4",
    "anyio>=4.14.2",
    "brotlicffi>=1.2.1.0",
    "httpcore2>=2.10.0",
    "httpx2>=2.12.0",
    "multidict>=6.9.1",
    "opentelemetry-api>=1.45.1",
    "pyasn1>=0.6.4",
    "soupsieve>=2.9.0",
    "werkzeug>=3.1.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Keep the repo baseline focused on correctness and deterministic imports.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
# Tell pyright/basedpyright where to find local modules
extraPaths = ["lib", "orchestrator", "skills", "bin", "api"]
pythonVersion = "3.12"
# Disable type checking - this codebase works fine without strict types
typeCheckingMode = "off"
reportMissingImports = false
reportMissingTypeStubs = false

[tool.pytest.ini_options]
# Keep the project suite separate from optional example/vendor tests under docs/.
testpaths = ["tests"]

[project]
name = "jarvis-voice"
version = "1.0.0"
description = "Self-hosted intelligent voice assistant"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "xai-sdk>=1.5.0",
    "av==15.1.0",
    "certifi==2025.8.3",
    "cffi==2.0.0",
    "charset-normalizer==3.4.3",
    "coloredlogs==15.0.1",
    "ctranslate2==4.6.0",
    "faster-whisper==1.2.0",
    "filelock==3.19.1",
    "flatbuffers==25.2.10",
    "fsspec==2025.9.0",
    "hf-xet==1.1.10",
    "huggingface-hub==0.35.0",
    "humanfriendly==10.0",
    "idna==3.10",
    "joblib==1.5.2",
    "mpmath==1.3.0",
    "numpy==2.3.3",
    "onnxruntime==1.22.1",
    "openwakeword==0.4.0",
    "packaging==25.0",
    "protobuf==6.32.1",
    "pycparser==2.23",
    "PyYAML==6.0.2",
    "requests==2.32.5",
    "scikit-learn==1.7.2",
    "scipy==1.16.2",
    "setuptools==80.9.0",
    "sounddevice==0.5.2",
    "soundfile==0.13.1",
    "speexdsp-ns==0.1.2",
    "sympy==1.14.0",
    "threadpoolctl==3.6.0",
    "tokenizers==0.22.0",
    "tqdm==4.67.1",
    "typing_extensions==4.15.0",
    "urllib3==2.5.0",
    "fpdf2==2.10.0",
    "pymupdf>=1.26.0",
    "spotipy>=2.25.0",
    "yt-dlp==2025.12.8",
    "paramiko>=3.0.0",
    "yfinance",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
# Tell pyright/basedpyright where to find local modules
extraPaths = ["lib", "orchestrator", "skills", "bin", "api"]
pythonVersion = "3.12"
# Disable type checking - this codebase works fine without strict types
typeCheckingMode = "off"
reportMissingImports = false
reportMissingTypeStubs = false
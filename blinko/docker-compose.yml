# Blinko - AI-Powered Note-Taking System
# Documentation: https://docs.blinko.space/
# API Docs: https://blinko.apidocumentation.com/reference
networks:
  blinko-network:
    driver: bridge

services:
  blinko-website:
    image: blinkospace/blinko:latest
    container_name: blinko-app
    environment:
      NODE_ENV: production
      TZ: America/Los_Angeles 
      
      # Auth configuration
      NEXTAUTH_URL: http://localhost:1111
      NEXT_PUBLIC_BASE_URL: http://localhost:1111
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      
      # Database connection
      DATABASE_URL: postgresql://blinko_user:${POSTGRES_PASSWORD}@blinko-postgres:5432/blinko_db
      
      # Optional: AI Features (OpenAI for embeddings/chat)
      # Uncomment and set if you want AI-powered features:
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
      # OPENAI_MODEL: gpt-4o-mini
      # EMBEDDING_MODEL: text-embedding-3-small
    
    depends_on:
      blinko-postgres:
        condition: service_healthy
    
    restart: unless-stopped
    
    ports:
      - "1111:1111"
    
    volumes:
      # Mount for attachments, uploads, and data
      - ./data:/app/.blinko
      # Mount your docs for viewing in Blinko UI
      # - ../docs:/app/docs:ro
    
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:1111/"]
      interval: 30s 
      timeout: 10s  
      retries: 5
      start_period: 40s
    
    networks:
      - blinko-network

  blinko-postgres:
    image: postgres:14-alpine
    container_name: blinko-postgres
    restart: unless-stopped
    
    environment:
      TZ: America/Los_Angeles  
      POSTGRES_DB: blinko_db
      POSTGRES_USER: blinko_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blinko_user -d blinko_db"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    
    networks:
      - blinko-network
    
    # Uncomment to expose PostgreSQL port (optional, for debugging)
    # ports:
    #   - "5432:5432"


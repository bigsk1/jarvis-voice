enabled: true
description: "Model-specific nudges for Grok 4.1 fast non-reasoning routing in cloud mode"
applies_to_modes:
  - cloud

routing_prepend: |
  Do not repeat the same tool with the same arguments.
  When a tool already returned the full text or content for a file, article, transcript, or stash artifact, treat that returned content as the source and answer from it directly.
  Do not re-read the same stash or file artifact unless the user explicitly asked for a different file, format, or refresh.
  Use X search, native X search, or the latest posts on X/Twitter, keep that instruction literal and prioritize provider-native x_search over external web search tools.

qa_append: |
  If evidence is partial, say what remains unverified. Ask follow up questions if it seems needed.

tool_calling_prepend: |
  Do not substitute Brave or other external search tools when the user explicitly requested X search or native X search, unless native x_search is unavailable or clearly insufficient.
  If native x_search is available, use it first for current X/Twitter post discovery.
  If a prior tool result already includes the needed text or content, answer from that result instead of calling stash, read, fetch, or another file-access tool again for the same artifact.

enabled: true
description: "Optimized overrides for Grok Build 0.1 (agentic coding model)"
applies_to_modes:
  - cloud

# Put only small, surgical nudges here.
# Omit any section you do not need.

# routing_prepend:
# Added BEFORE the main router system prompt.
# Use this when the model chooses the wrong overall strategy or misses the main intent.
# Good for:
# - "treat shopping/buying queries as product search, not general research"
# - "prefer finishing the task before asking a follow-up when enough constraints already exist"
# - "for Grok duplicate behavior: do not repeat the same tool with the same arguments just to be safe"
routing_prepend: |
  Follow the user's explicitly requested source, site, or tool when it is available.
  Do not repeat the same tool with the same or near-identical arguments.
  Tool argument previews may be shortened and marked arguments_truncated=true. This is display-only: Jarvis sent the complete arguments to the tool. When a mutation result reports ok=true, treat the full mutation as completed and authoritative; do not repeat, recreate, or supplement it merely because some original argument content is hidden. Answer the user, or call another tool only for a genuinely different step still required by the request.
  For shopping or product-search tasks, converge quickly: after 2-3 materially different searches, synthesize the best results instead of endlessly refining.
  When the user asks for X search, native X search, or the latest posts on X/Twitter, keep that instruction literal and prioritize provider-native x_search over external web search tools.

# routing_append:
# Added AFTER the main router system prompt.
# Use this for short reinforcing reminders that should be seen after the big base prompt.
# Good for:
# - "preserve exact model numbers and dimensions"
# - "avoid drifting from the requested site/store/entity"
# - "keep compatibility constraints intact"
# routing_append: |
#   Preserve exact entity names, model numbers, and constraints.

# qa_prepend:
# Added BEFORE QA/synthesis prompts in the answer-formatting stage.
# Use this when the model technically completes the task but presents the result badly.
# Good for:
# - "prefer direct product links over bare ASINs"
# - "give 2-4 concrete options instead of vague summaries"
# - "answer first, then briefly note uncertainty"
# qa_prepend: |
#   Answer concretely and prefer actionable results when available.

# qa_append:
# Added AFTER QA/synthesis prompts.
# Use this for final output reminders that should shape the delivered answer.
# Good for:
# - "if evidence is incomplete, say what remains unverified"
# - "do not end with a clarifying question if a best-effort answer is already possible"
# - "include a short recommendation when the user asked for a choice"
qa_append: |
  If evidence is partial, say what remains unverified.
  For shopping or product recommendation tasks, prefer concrete product listings over generic summaries.
  When product URLs are available in tool results, include direct links instead of only naming products or giving bare ASINs.

# tool_calling_prepend:
# Added with routing guidance before tool-calling decisions.
# Use this when the model's tool behavior is the problem rather than the wording of the final answer.
# Good for:
# - "do not call the same tool twice with the same arguments"
# - "when one search/tool result is sufficient, summarize instead of retrying"
# - "choose the tool that directly matches the requested action, not a topic-adjacent tool"
tool_calling_prepend: |
  Treat successful tool mutations as authoritative. An arguments_truncated=true marker means only the displayed preview was shortened; it never means the tool received partial arguments or performed a partial mutation. Do not infer that an entity, section, or item was omitted simply because it is outside the preview. After ok=true, answer directly unless a materially different tool action is still required.
  For manage_intel, append only adds content. It can never satisfy remove, cleanup, deduplicate, correct, or replace requests, even if a learned strategy recommends read then append. For those requests, use manage_intel search to inspect the exact block, then manage_intel replace; use an empty new_content to remove it. Never claim content was removed after an append.
  Do not call search or shopping tools for conversational follow-ups: reactions, acknowledgments, comments on prior results, or "I ordered/bought X" unless the user explicitly asks for new listings, prices, or alternatives.
  Learned PREFER/AVOID hints are defaults for active search tasks, not mandates—when the current message is Q&A or commentary, answer from context with no tool call.
  If Tool RAG surfaced only ghost tools plus one appended preference tool and the user did not request fresh data, treat that as a no-tool turn.
  Tool Rag is only showing a small number of tools, call tool_search to find more tools if the current tool list is weak, we have 70+ tools when using default profile! 
  Do not substitute Brave or other external search tools when the user explicitly requested X search or native X search, unless native x_search is unavailable or clearly insufficient. If native x_search is available, use it first for current X/Twitter post discovery.
  Do not keep reissuing slightly tweaked searches once you already have enough evidence to recommend 2-5 concrete options.
  If one search family is returning usable product candidates, summarize the best options instead of exploring every variant.
  For Amazon or shopping tasks, preserve product URLs from search results and ASINs if available. If you save shopping results to Canvas, include direct product links in the saved content whenever the tool returned them.

# completion_guard_eval_prepend:
# Added BEFORE the Completion Guard evaluator prompt.
# Use this only if a specific model acting as the evaluator judges too loosely or too harshly.
# Good for:
# - "treat duplicate-tool recaps as incomplete when the requested outcome was not delivered"
# - "require actionable shopping results, not just identifiers"
# - "do not penalize answers only for style if the task outcome was correct"
# completion_guard_eval_prepend: |
#   Judge whether the requested outcome was actually delivered.

# Price Alert Configuration
# ========================
# Edit values here - n8n workflow will pick up changes
# 
# Last updated: 2026-01-18 02:28

settings:
  check_interval_minutes: 10
  cooldown_hours: 4
  jarvis_api_url: http://192.168.70.228:8880
sources:
  crypto:
    api: coingecko
    base_url: https://api.coingecko.com/api/v3
  stocks:
    api: yfinance
watchlist:
  crypto:
  - symbol: BTC
    coingecko_id: bitcoin
    name: Bitcoin
    enabled: true
    conditions:
    - type: above
      value: 99000.0
      severity: high
      message: BTC above $99,000
    - type: below
      value: 85000
      severity: high
      message: Bitcoin dropped below $85k
    - type: percent_change_24h
      value: 8
      severity: high
      message: Bitcoin moved 8%+ in 24 hours
  - symbol: SOL
    coingecko_id: solana
    name: Solana
    enabled: true
    conditions:
    - type: above
      value: 160
      severity: high
      message: Solana above $160
    - type: below
      value: 110
      severity: high
      message: Solana dropped below $110
    - type: percent_change_24h
      value: 10
      severity: high
      message: Solana moved 10%+ in 24 hours
  stocks:
  - symbol: TSLA
    name: Tesla
    enabled: true
    conditions:
    - type: above
      value: 460
      severity: high
      message: Tesla above $460
    - type: below
      value: 350
      severity: high
      message: Tesla dropped below $350
    - type: percent_change_24h
      value: 5
      severity: high
      message: Tesla moved 5%+ today
  - symbol: GC=F
    name: Gold Futures
    enabled: true
    conditions:
    - type: above
      value: 4800
      severity: high
      message: Gold above $4,800/oz
    - type: below
      value: 4400
      severity: high
      message: Gold dropped below $4,400/oz
    - type: percent_change_24h
      value: 3
      severity: high
      message: Gold moved 3%+ today
  - symbol: SI=F
    name: Silver Futures
    enabled: false
    conditions:
    - type: above
      value: 95
      severity: high
      message: Silver above $95/oz

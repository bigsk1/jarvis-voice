<?xml version="1.0" encoding="UTF-8"?>
<!--
  Jarvis HUD header logo - self-contained animated SVG.

  Usage (animations + online/offline states):
    " Inline in HTML: copy/paste or fetch + innerHTML
    " <object type="image/svg+xml" data="/assets/jarvis-hud-logo.svg">
    " <embed src="/assets/jarvis-hud-logo.svg">

  Usage (static only  no animation):
    " <img src="/assets/jarvis-hud-logo.svg">

  Connection state: add class "online" or "offline" to the root <svg>.
-->
<svg id="jarvisHudLogo" class="offline" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" shape-rendering="geometricPrecision" role="img" aria-label="Jarvis">
  <style>
    #jarvisHudLogo {
      --jhl-center: 100px;
    }

    #jarvisHudLogo .jhl-status-arc,
    #jarvisHudLogo .jhl-status-dots {
      transition: stroke 0.35s ease, fill 0.35s ease, opacity 0.35s ease;
    }

    #jarvisHudLogo.online .jhl-status-sweep {
      transform-origin: var(--jhl-center) var(--jhl-center);
      animation: jhl-hud-scan 14s linear infinite;
    }

    #jarvisHudLogo.online .jhl-status-arc {
      stroke: #ff9900;
      opacity: 1;
    }

    #jarvisHudLogo.online .jhl-status-dots {
      fill: #ff9900;
      opacity: 1;
    }

    #jarvisHudLogo.online .jhl-tick-ring,
    #jarvisHudLogo.online .jhl-hud-arcs {
      opacity: 1;
    }

    #jarvisHudLogo.offline .jhl-status-arc {
      stroke: #cc4444;
      opacity: 0.55;
    }

    #jarvisHudLogo.offline .jhl-status-sweep {
      animation: none;
    }

    #jarvisHudLogo.offline .jhl-status-dots {
      fill: #cc4444;
      opacity: 0.45;
    }

    #jarvisHudLogo.offline .jhl-tick-ring,
    #jarvisHudLogo.offline .jhl-hud-arcs {
      opacity: 0.65;
    }

    @keyframes jhl-hud-scan {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
  </style>

  <g class="jhl-tick-ring" stroke="#00c8dc" stroke-width="1.5" stroke-linecap="round">

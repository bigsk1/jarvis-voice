# Promtail configuration for Jarvis log shipping
# Scrapes JSON logs and ships to Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

# Position tracking (where we are in each log file)
positions:
  filename: /tmp/positions.yaml

# Where to send logs
clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576  # 1MB

# What logs to scrape
scrape_configs:
  # ==========================================
  # Tool Call Logs (JSONL format)
  # ==========================================
  - job_name: jarvis_tools
    static_configs:
      - targets:
          - localhost
        labels:
          job: jarvis
          log_type: tools
          host: fred
          __path__: /var/log/jarvis/tools/tool-calls-*.jsonl
    
    pipeline_stages:
      # Parse JSON structure (matches tool_logger.py format)
      - json:
          expressions:
            timestamp: timestamp
            tool_name: tool
            mode: mode
            duration_ms: duration_ms
            result_ok: result.ok
            result_error: result.error
            
      # Extract labels for filtering
      - labels:
          tool_name:
          mode:
          result_ok:
          
      # Add timestamp
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          
      # Output format
      - output:
          source: message

  # ==========================================
  # LLM Call Logs
  # ==========================================
  - job_name: jarvis_llm
    static_configs:
      - targets:
          - localhost
        labels:
          job: jarvis
          log_type: llm
          host: fred
          __path__: /var/log/jarvis/llm-calls-*.jsonl
    
    pipeline_stages:
      # Parse JSON structure (matches llm_logger.py format)
      - json:
          expressions:
            timestamp: timestamp
            model: model
            provider: provider
            mode: mode
            prompt_type: prompt_type
            duration_ms: duration_ms
            success: success
            error: error
            input_tokens: input_tokens      # Flattened fields (easier querying)
            output_tokens: output_tokens
            total_tokens: total_tokens
            cost_usd: cost_usd
            response_type: response.type
            tool_name: response.tool_name
            
      - labels:
          model:
          provider:
          mode:
          prompt_type:
          success:
          response_type:
          
      - timestamp:
          source: timestamp
          format: RFC3339Nano

  # ==========================================
  # OpenCode Logs (Text format)
  # ==========================================
  - job_name: jarvis_opencode
    static_configs:
      - targets:
          - localhost
        labels:
          job: jarvis
          log_type: opencode
          host: fred
          __path__: /var/log/jarvis/opencode-*.log
    
    pipeline_stages:
      # Parse log level from text
      - regex:
          expression: '^\[(?P<timestamp>.*?)\] \[(?P<level>.*?)\] (?P<message>.*)'
          
      - labels:
          level:
          
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05'

  # ==========================================
  # MCP Tool Logs (JSON format)
  # ==========================================
  - job_name: jarvis_mcp
    static_configs:
      - targets:
          - localhost
        labels:
          job: jarvis
          log_type: mcp
          host: fred
          __path__: /var/log/jarvis/mcp-*.log
    
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            server: server
            tool: tool
            status: status
            duration_ms: duration_ms
            
      - labels:
          server:
          tool:
          status:

  # ==========================================
  # Memory Operations (future)
  # ==========================================
  - job_name: jarvis_memory
    static_configs:
      - targets:
          - localhost
        labels:
          job: jarvis
          log_type: memory
          host: fred
          __path__: /var/log/jarvis/memory-*.jsonl
    
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            operation: operation
            search_type: search_type
            query: query
            result_count: result_count
            duration_ms: duration_ms
            
      - labels:
          operation:
          search_type:

  # ==========================================
  # Intelligence Layer Logs (Self-Learning)
  # ==========================================
  - job_name: jarvis_intelligence
    static_configs:
      - targets:
          - localhost
        labels:
          job: jarvis
          log_type: intelligence
          host: fred
          __path__: /var/log/jarvis/intelligence/intelligence-*.jsonl
    
    pipeline_stages:
      # Parse JSON structure (matches intelligence.py logging format)
      - json:
          expressions:
            timestamp: timestamp
            event: event
            experience_id: experience_id
            insight_id: insight_id
            query: query
            tools_used: tools_used
            constraint_type: constraint_type
            confidence: confidence
            provider: provider
            model: model
            
      # Extract labels for filtering
      - labels:
          event:
          constraint_type:
          provider:
          model:
          
      - timestamp:
          source: timestamp
          format: RFC3339Nano

  # ==========================================
  # Feedback Logs (LLM-as-QA grading)
  # ==========================================
  - job_name: jarvis_feedback
    static_configs:
      - targets:
          - localhost
        labels:
          job: jarvis
          log_type: feedback
          host: fred
          __path__: /var/log/jarvis/feedback/feedback-*.jsonl
    
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            rating: rating
            mode: mode
            session_id: session_id
            result_ok: result_ok
            feedback_provider: feedback_provider
            feedback_model: feedback_model
            query: query
            summary: summary
            
      - labels:
          rating:
          mode:
          result_ok:
          feedback_provider:
          feedback_model:
          
      - timestamp:
          source: timestamp
          format: RFC3339Nano

  # ==========================================
  # Evolution Logs (Prompt/Tool improvements)
  # ==========================================
  - job_name: jarvis_evolution
    static_configs:
      - targets:
          - localhost
        labels:
          job: jarvis
          log_type: evolution
          host: fred
          __path__: /var/log/jarvis/evolution/evolution-*.jsonl
    
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            event: event
            component: component
            component_type: component_type
            version: version
            mode: mode
            auto_deploy: auto_deploy
            change_summary: change_summary
            
      - labels:
          event:
          component:
          component_type:
          mode:
          auto_deploy:
          
      - timestamp:
          source: timestamp
          format: RFC3339Nano

  # ==========================================
  # Tool Builder Logs (Auto-generated tools)
  # ==========================================
  - job_name: jarvis_tool_builder
    static_configs:
      - targets:
          - localhost
        labels:
          job: jarvis
          log_type: tool_builder
          host: fred
          __path__: /var/log/jarvis/tool-builder/tool-builder-*.jsonl
    
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            event: event
            tool_name: tool_name
            status: status
            mode: mode
            purpose: purpose
            verification_passed: verification_passed
            builder_provider: builder_provider
            builder_model: builder_model
            
      - labels:
          event:
          tool_name:
          status:
          mode:
          verification_passed:
          builder_provider:
          
      - timestamp:
          source: timestamp
          format: RFC3339Nano

  # ==========================================
  # Ouroboros Research Logs (Tool Builder → Jarvis)
  # ==========================================
  - job_name: jarvis_ouroboros
    static_configs:
      - targets:
          - localhost
        labels:
          job: jarvis
          log_type: ouroboros
          host: fred
          __path__: /var/log/jarvis/tool-builder/ouroboros-research-*.jsonl
    
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            event: event
            mode: mode
            query: query
            status: status
            duration_ms: duration_ms
            tools_used: jarvis_response.tools_used
            response_length: response_length
            
      - labels:
          event:
          mode:
          status:
          
      - timestamp:
          source: timestamp
          format: RFC3339Nano

  # ==========================================
  # Self-Play Logs (Training sessions)
  # ==========================================
  - job_name: jarvis_self_play
    static_configs:
      - targets:
          - localhost
        labels:
          job: jarvis
          log_type: self_play
          host: fred
          __path__: /var/log/jarvis/self-play/self-play-*.jsonl
    
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            session_id: session_id
            mode: mode
            query: query
            category: category
            ok: ok
            duration_ms: duration_ms
            
      - labels:
          session_id:
          mode:
          category:
          ok:
          
      - timestamp:
          source: timestamp
          format: RFC3339Nano

  # ==========================================
  # Workflow Execution Logs
  # ==========================================
  - job_name: jarvis_workflows
    static_configs:
      - targets:
          - localhost
        labels:
          job: jarvis
          log_type: workflows
          host: fred
          __path__: /var/log/jarvis/workflows-*.jsonl
    
    pipeline_stages:
      # Parse JSON structure (matches workflow_logger format)
      - json:
          expressions:
            timestamp: timestamp
            mode: mode
            type: type
            workflow_id: workflow_id
            workflow_name: workflow_name
            user_query: user_query
            result_ok: result.ok
            steps_completed: result.steps_completed
            duration_ms: duration_ms
            
      # Extract labels for filtering
      - labels:
          mode:
          workflow_id:
          result_ok:
          
      - timestamp:
          source: timestamp
          format: RFC3339Nano

  # ==========================================
  # Orchestrator Logs (General)
  # ==========================================
  - job_name: jarvis_orchestrator
    static_configs:
      - targets:
          - localhost
        labels:
          job: jarvis
          log_type: orchestrator
          host: fred
          __path__: /var/log/jarvis/orchestrator-*.log
    
    pipeline_stages:
      - regex:
          expression: '^\[(?P<timestamp>.*?)\] \[(?P<level>.*?)\] (?P<message>.*)'
          
      - labels:
          level:


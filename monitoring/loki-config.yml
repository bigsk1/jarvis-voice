# Loki configuration for Jarvis monitoring
# Optimized for single-server deployment on Fred

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

# Schema configuration for log storage
schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

# Query limits and performance
limits_config:
  # Retention: Keep logs for 30 days
  retention_period: 720h
  
  # Reject old samples (older than 7 days)
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  
  # Query limits
  max_query_length: 721h  # 30 days + 1 hour
  max_query_lookback: 720h
  max_streams_per_user: 10000
  max_entries_limit_per_query: 10000
  
  # Ingestion rate limits (generous for single user)
  ingestion_rate_mb: 50
  ingestion_burst_size_mb: 100
  
  # Per-stream limits
  per_stream_rate_limit: 10MB
  per_stream_rate_limit_burst: 20MB

# Chunk storage configuration
chunk_store_config:
  max_look_back_period: 0s

# Table manager for retention
table_manager:
  retention_deletes_enabled: true
  retention_period: 720h

# Compactor for cleanup
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

# Query frontend (for better performance)
query_range:
  align_queries_with_step: true
  cache_results: true
  max_retries: 5

# Ruler configuration (for alerts - future use)
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://localhost:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true


[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-craft-gateway"
version = "0.2.0"
description = "Optional self-hosted Craft CLI/MCP gateway for Jarvis Voice"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "uvicorn==0.49.0", "pydantic==2.13.4"]

[project.scripts]
craft-gateway = "craft_gateway.__main__:main"

[tool.setuptools.packages.find]
include = ["craft_gateway*"]

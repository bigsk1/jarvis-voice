<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis Docs - Login</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <style>
    :root {
      --bg-primary: #0b0c10;
      --bg-secondary: #12151b;
      --bg-card: rgba(18, 21, 27, 0.92);
      --border: rgba(158, 173, 199, 0.18);
      --text-primary: #f3f6fb;
      --text-secondary: #9da9ba;
      --accent: #5eead4;
      --accent-strong: #14b8a6;
      --accent-glow: rgba(94, 234, 212, 0.22);
      --error: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text-primary);
      background:
        radial-gradient(circle at top left, rgba(94, 234, 212, 0.12), transparent 32%),
        radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.14), transparent 30%),
        var(--bg-primary);
    }
    .login-shell {
      width: min(100%, 420px);
      padding: 36px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--bg-card);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
    }
    .eyebrow {
      color: var(--accent);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 12px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 32px;
      line-height: 1.05;
      margin-bottom: 10px;
    }
    p {
      color: var(--text-secondary);
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(8, 11, 18, 0.82);
      color: var(--text-primary);
      font-size: 16px;
      margin-bottom: 18px;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }
    button {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #052420;
      font-weight: 700;
      cursor: pointer;
    }
    .error {
      display: none;
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(248, 113, 113, 0.45);
      background: rgba(127, 29, 29, 0.2);
      color: #fecaca;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <form class="login-shell" id="loginForm">
    <div class="eyebrow">Shared auth</div>
    <h1>Jarvis Docs</h1>
    <p>Same password gate as the rest of your Jarvis UIs.</p>
    <div id="errorMessage" class="error"></div>
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter your password" autofocus>
    <button id="loginBtn" type="submit">Open Docs</button>
  </form>

  <script>
    const form = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const errorMessage = document.getElementById('errorMessage');

    const showError = (message) => {
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
    };

    const existingToken = localStorage.getItem('jarvis_auth_token');
    if (existingToken) {
      fetch('/api/auth/verify', { headers: { Authorization: `Bearer ${existingToken}` } })
        .then((response) => response.json())
        .then((data) => {
          if (data.ok) {
            window.location.href = new URLSearchParams(window.location.search).get('redirect') || '/';
          } else {
            localStorage.removeItem('jarvis_auth_token');
            document.cookie = 'jarvis_auth=; path=/; max-age=0; SameSite=Lax';
          }
        })
        .catch(() => {
          localStorage.removeItem('jarvis_auth_token');
          document.cookie = 'jarvis_auth=; path=/; max-age=0; SameSite=Lax';
        });
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorMessage.classList.remove('show');
      loginBtn.disabled = true;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordInput.value }),
        });
        const data = await response.json();
        if (!response.ok || !data.ok || !data.token) {
          showError(data.error || 'Login failed');
          return;
        }
        localStorage.setItem('jarvis_auth_token', data.token);
        document.cookie = `jarvis_auth=${data.token}; path=/; max-age=${(data.expires_in_days || 30) * 86400}; SameSite=Lax`;
        window.location.href = new URLSearchParams(window.location.search).get('redirect') || '/';
      } catch (_error) {
        showError('Connection failed');
      } finally {
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>

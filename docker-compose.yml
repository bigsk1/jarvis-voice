x-jarvis-common: &jarvis-common
  build:
    context: .
  image: jarvis-voice:local
  restart: unless-stopped
  user: "${JARVIS_DOCKER_UID:-1000}:${JARVIS_DOCKER_GID:-1000}"
  networks:
    - jarvis-net
  environment: &jarvis-environment
    HOME: /tmp
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
    UMASK: "002"
    JARVIS_DEPLOYMENT: docker
    JARVIS_MODE: "${JARVIS_MODE:-cloud}"
    # Optional override for init-time sync-tools only. Leave unset in .env to match JARVIS_MODE.
    # Use "cloud local" (space-separated) to sync both DBs on first bring-up.
    JARVIS_SYNC_MODES: "${JARVIS_SYNC_MODES:-}"
    JARVIS_VENV: /opt/venv
    VIRTUAL_ENV: /opt/venv
    UV_PROJECT_ENVIRONMENT: /opt/venv
    # Use "default" for hybrid native CLI/wake-word access, then block
    # container-incompatible tools in Web UI Settings.
    JARVIS_OVERRIDE_JARVIS_TOOL_PROFILE: "${JARVIS_DOCKER_TOOL_PROFILE:-docker}"
    JARVIS_OVERRIDE_JARVIS_API_INTERNAL_URL: "http://jarvis-api:8880"
    JARVIS_OVERRIDE_CANVAS_INTERNAL_URL: "http://jarvis-canvas:8890"
    JARVIS_OVERRIDE_JARVIS_API_AUTH: "${JARVIS_DOCKER_API_AUTH:-false}"
  volumes: &jarvis-volumes
    - ./config:/app/config:ro
    - ./data:/app/data
    - ./logs:/app/logs
    - ./audio:/app/audio
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  jarvis-api:
    <<: *jarvis-common
    command: ["api"]
    ports:
      - "127.0.0.1:${JARVIS_API_PORT:-8880}:8880"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8880/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  jarvis-web:
    <<: *jarvis-common
    command: ["web"]
    environment:
      <<: *jarvis-environment
      # Keep Web status-only TTS audio across container rebuilds/recreation.
      JARVIS_OVERRIDE_WEB_STATUS_TTS_CACHE_DIR: /app/data/cache/status-tts-web
    depends_on:
      jarvis-api:
        condition: service_started
      jarvis-canvas:
        condition: service_started
    ports:
      - "${JARVIS_WEB_PORT:-5001}:5001"
    volumes:
      - ./config:/app/config:ro
      - type: bind
        source: ./jarvis-web/config/web_config.json
        target: /app/jarvis-web/config/web_config.json
        bind:
          create_host_path: false
      - ./data:/app/data
      - ./logs:/app/logs
      - ./audio:/app/audio
      - ./jarvis-web/data/uploads:/app/jarvis-web/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5001/api/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  jarvis-services:
    <<: *jarvis-common
    command: ["services"]
    depends_on:
      jarvis-api:
        condition: service_started

  jarvis-canvas:
    <<: *jarvis-common
    command: ["canvas"]
    ports:
      - "${JARVIS_CANVAS_PORT:-8890}:8890"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8890/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  jarvis-memory:
    <<: *jarvis-common
    command: ["memory"]
    ports:
      - "${JARVIS_MEMORY_PORT:-5002}:5002"
    profiles: ["extras"]

  jarvis-intelligence:
    <<: *jarvis-common
    command: ["intelligence"]
    ports:
      - "${JARVIS_INTELLIGENCE_PORT:-5003}:5003"
    profiles: ["extras"]

  jarvis-docs:
    <<: *jarvis-common
    command: ["docs"]
    ports:
      - "${JARVIS_DOCS_PORT:-5004}:5004"
    profiles: ["extras"]

networks:
  jarvis-net:
    name: jarvis-net
